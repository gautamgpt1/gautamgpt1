<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <style>
      .node { fill: #58a6ff; animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; } .n5 { animation-delay: 2.4s; }
      .link { stroke: #58a6ff; stroke-opacity: .25; stroke-width: 1.5; stroke-dasharray: 6 6; animation: flow 4s linear infinite; }
      .title { font: 700 56px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #f0f6fc; }
      .sub { font: 400 22px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #8b949e; }
      .tag { font: 600 15px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #58a6ff; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
    </style>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>

  <!-- mesh network motif (nod to MeshLive) -->
  <g>
    <line class="link" x1="860" y1="70"  x2="1000" y2="120"/>
    <line class="link" x1="1000" y1="120" x2="1110" y2="70"/>
    <line class="link" x1="1000" y1="120" x2="950" y2="210"/>
    <line class="link" x1="950" y1="210" x2="1090" y2="200"/>
    <line class="link" x1="1110" y1="70"  x2="1090" y2="200"/>
    <line class="link" x1="860" y1="70"  x2="950" y2="210"/>
    <circle class="node"    cx="860"  cy="70"  r="7"/>
    <circle class="node n2" cx="1000" cy="120" r="10"/>
    <circle class="node n3" cx="1110" cy="70"  r="6"/>
    <circle class="node n4" cx="950"  cy="210" r="8"/>
    <circle class="node n5" cx="1090" cy="200" r="6"/>
  </g>

  <text x="70" y="125" class="title">Gautam Gupta</text>
  <rect x="72" y="145" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="190" class="sub">Tech enthusiast. I build whatever I can't stop thinking about.</text>
  <text x="70" y="228" class="tag">mobile  ·  desktop  ·  dev tools  ·  crypto  ·  New Delhi, India</text>
</svg>
