name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/gautamgpt1,https://meshlive.hashnode.dev/rss.xml"
          max_post_count: 5
          remove_duplicates: true
          template: "- [$title]($url)$newline"
